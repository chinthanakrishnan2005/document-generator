<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AI PRD Generator</title>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
body {
    font-family: Arial;
    background: linear-gradient(135deg, #0f172a, #1e293b);
    color: white;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

.container {
    width: 80%;
    max-width: 800px;
    background: #1e293b;
    padding: 30px;
    border-radius: 15px;
    text-align: center;
}

textarea {
    width: 100%;
    height: 120px;
    padding: 12px;
    border-radius: 10px;
}

button {
    margin: 10px;
    padding: 10px 20px;
    background: #38bdf8;
    border: none;
    border-radius: 8px;
    cursor: pointer;
}

.output {
    margin-top: 20px;
    background: #0f172a;
    padding: 15px;
    border-radius: 10px;
    white-space: pre-wrap;
    max-height: 300px;
    overflow-y: auto;
}

.status {
    margin-top: 10px;
    font-weight: bold;
}
</style>
</head>

<body>

<div class="container">

<h1>🚀 AI PRD Generator</h1>

<textarea id="inputText" placeholder="Enter your idea..."></textarea>

<br>

<button onclick="generatePRD()">Generate PRD</button>
<button onclick="downloadPDF()">Download PDF</button>

<div class="status" id="status"></div>
<div class="output" id="output"></div>

</div>

<script>

let latestPRD = "";

async function generatePRD() {

    const input = document.getElementById("inputText").value;
    const output = document.getElementById("output");
    const status = document.getElementById("status");

    if (!input.trim()) {
        alert("Enter something!");
        return;
    }

    output.innerHTML = "⏳ Generating...";
    status.innerHTML = "";

    try {
        const res = await fetch("http://127.0.0.1:8000/generate-doc", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({input})
        });

        const data = await res.json();

        latestPRD = data.final_document;

        output.innerHTML = marked.parse(latestPRD);

        status.innerHTML =
            `Status: ${data.status} | Iterations: ${data.iterations}`;

        status.style.color =
            data.status === "approved" ? "lightgreen" : "orange";

    } catch (err) {
        output.innerHTML = "❌ Backend error";
    }
}

function downloadPDF() {

    if (!latestPRD) {
        alert("Generate PRD first!");
        return;
    }

    const { jsPDF } = window.jspdf;
    const doc = new jsPDF();

    const lines = doc.splitTextToSize(latestPRD, 180);
    doc.text(lines, 10, 10);

    doc.save("PRD.pdf");
}

</script>

</body>
</html>
